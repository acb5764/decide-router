# Sample Cursor / Decide-Router config
goal: "Ship features safely without touching production"
playbooks:
  - safe-change
  - bootstrapped-alignment
bootstrap:
  onSessionStart: true
  minConfidence: 0.72
policy:
  # fail_closed controls invalid-regex handling — separate from process-crash fail-open
  fail_closed: true
  scan_secrets: true
  network:
    default: allow
    allow: []
  # Opt-in restrictive egress sample (uncomment to enable deny-by-default):
  # network:
  #   default: deny
  #   allow:
  #     - api.github.com
decisions:
  action_gate:
    min_confidence: 0.72
    mid_cascade: true
  loop_detector:
    window: 12
    max_repeats: 2
audit:
  path: "~/.cursor/decide-router/audit.jsonl"
