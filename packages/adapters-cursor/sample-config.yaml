# Sample Cursor / Decide-Router config
goal: "Ship features safely without touching production"
# Hook adapters fail open unless fail_closed: true under policy
playbooks:
  - safe-change
  - bootstrapped-alignment
bootstrap:
  onSessionStart: true
  minConfidence: 0.72
policy:
  fail_closed: false
  scan_secrets: true
decisions:
  action_gate:
    min_confidence: 0.72
    mid_cascade: true
  loop_detector:
    window: 12
    max_repeats: 2
  context_prune:
    enabled: true
audit:
  path: "~/.cursor/decide-router/audit.jsonl"
