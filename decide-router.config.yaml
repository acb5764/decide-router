goal: "Ship Decide-Router MVP without touching production deploys"
backends:
  primary: gliner-decide   # local
  fallback: heuristic
policy:
  protected_paths:
    - "**/prod/**"
    - "**/.env*"
    - "**/terraform.tfstate"
  dangerous_shell_patterns:
    - "rm\\s+-rf"
    - "chmod\\s+777"
    - "curl.*\\|\\s*sh"
    - "wget.*\\|\\s*sh"
    - "chmod\\s+-R"
    - "chown\\s+-R"
  network:
    default: deny
    allow:
      - "api.github.com"
  permission_deny_shapes:
    - "*"
    - "*:*"
    - "AdministratorAccess"
  fail_closed: true
decisions:
  action_gate:
    min_confidence: 0.72
    mid_cascade: true
  loop_detector:
    window: 12
    max_repeats: 2
  context_prune:
    enabled: false
  tool_routing:
    mode: cascade
    top_k: 3
    min_confidence: 0.65
playbooks:
  - "safe-change"
